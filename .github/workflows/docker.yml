name: Docker

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# GHCR image paths must be all lowercase. Each platform builds natively on its
# own runner: compiling V8 under QEMU emulation exceeds any sane job budget,
# so cross-build is not an option. A final job stitches the per-platform
# images into one multi-platform manifest list. No external secrets: the
# workflow GITHUB_TOKEN with packages:write is sufficient for GHCR.
env:
  IMAGE: ghcr.io/lawlietr/obscura-cjk

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform-suffix: amd64
          - os: ubuntu-24.04-arm
            platform-suffix: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: |
            OBSCURA_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ matrix.platform-suffix }}
          cache-from: type=gha,scope=docker-${{ matrix.platform-suffix }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform-suffix }}

  publish-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble multi-platform manifest list
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
