name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # Build on Ubuntu 22.04 so the Linux release binary works on
            # common LTS servers with glibc 2.35 instead of requiring the
            # newer glibc shipped by ubuntu-latest.
            os: ubuntu-22.04
            name: obscura-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            # Native build on GitHub's ARM runner.
            os: ubuntu-22.04-arm
            name: obscura-aarch64-linux
          - target: aarch64-apple-darwin
            os: macos-latest
            name: obscura-aarch64-macos
          - target: x86_64-apple-darwin
            # Must run on a native Intel runner. obscura-js bakes a V8 startup
            # snapshot at build time, and that snapshot is architecture specific.
            # macos-latest is Apple Silicon, so building x86_64 there embeds an
            # arm64 snapshot into the Intel binary and V8 crashes deserializing
            # it at isolate init (issue #290). macos-15-intel is the last x86_64
            # image (available until Aug 2027); there is no cross-build that
            # produces a correct snapshot.
            os: macos-15-intel
            name: obscura-x86_64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: obscura-x86_64-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install stealth build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev

      - name: Configure libclang (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Use one coherent SDK. A hard-coded CommandLineTools include path can
          # mix libc++ headers with the selected Xcode SDK and break BoringSSL.
          XCODE_PATH="$(xcode-select -p)"
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-isystem $SDK_PATH/usr/include/c++/v1" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$XCODE_PATH/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Configure libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build render,stealth release binary
        run: cargo build --release --target ${{ matrix.target }} -p obscura-cli --bins --features render,stealth

      - name: Stage stealth release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release
          mkdir -p dist/stealth
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/stealth/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/stealth/
          fi

      - name: Build render,cjk release binary
        run: cargo build --release --target ${{ matrix.target }} -p obscura-cli --bins --features render,cjk

      - name: Stage cjk release binary
        shell: bash
        run: |
          # This fork's flagship variant: embeds the Noto Sans CJK fallback
          # faces so Chinese/Japanese text shapes without host fonts.
          BIN_DIR=target/${{ matrix.target }}/release
          mkdir -p dist/cjk
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/cjk/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/cjk/
          fi

      - name: Build render,cjk,stealth release binary
        run: cargo build --release --target ${{ matrix.target }} -p obscura-cli --bins --features render,cjk,stealth

      - name: Stage cjk-stealth release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release
          mkdir -p dist/cjk-stealth
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/cjk-stealth/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/cjk-stealth/
          fi

      - name: Smoke test release binaries (V8 snapshot)
        # Run the V8 path once so a release never ships a binary that crashes at
        # isolate init from a mismatched snapshot (issue #290). The data: URL
        # keeps it offline. Every target here is native, so the runner can
        # execute all variants it just built.
        shell: bash
        run: |
          for VARIANT in stealth cjk cjk-stealth; do
            BIN=dist/$VARIANT/obscura
            [ -f "$BIN.exe" ] && BIN="$BIN.exe"
            "$BIN" fetch "data:text/html,<title>ok</title>" --eval "1+1"
          done
          for VARIANT in stealth cjk cjk-stealth; do
            BIN=dist/$VARIANT/obscura
            [ -f "$BIN.exe" ] && BIN="$BIN.exe"
            "$BIN" fetch "data:text/html,<style>body{margin:0;background:%23123456}</style>" --screenshot smoke.png
            test -s smoke.png
            rm smoke.png
          done
          # Exercise the embedded CJK fallback faces. Numeric character
          # references keep the data: URL pure ASCII while the DOM decodes to
          # han and hiragana glyphs, so shaping runs through the fallback path.
          for VARIANT in cjk cjk-stealth; do
            BIN=dist/$VARIANT/obscura
            [ -f "$BIN.exe" ] && BIN="$BIN.exe"
            "$BIN" fetch "data:text/html,<style>body{margin:0}</style><h1>&#32321;&#39636;&#20013;&#25991;&#12486;&#12473;&#12488;</h1>" --screenshot smoke-cjk.png
            test -s smoke-cjk.png
            rm smoke-cjk.png
          done

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar czf ${{ matrix.name }}-stealth.tar.gz -C dist/stealth obscura obscura-worker
          tar czf ${{ matrix.name }}-cjk.tar.gz -C dist/cjk obscura obscura-worker
          tar czf ${{ matrix.name }}-cjk-stealth.tar.gz -C dist/cjk-stealth obscura obscura-worker

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist/stealth
          7z a ../../${{ matrix.name }}-stealth.zip obscura.exe obscura-worker.exe
          cd ../cjk
          7z a ../../${{ matrix.name }}-cjk.zip obscura.exe obscura-worker.exe
          cd ../cjk-stealth
          7z a ../../${{ matrix.name }}-cjk-stealth.zip obscura.exe obscura-worker.exe

      - name: Upload packaged binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.name }}
          path: |
            ${{ matrix.name }}-stealth.tar.gz
            ${{ matrix.name }}-cjk.tar.gz
            ${{ matrix.name }}-cjk-stealth.tar.gz
            ${{ matrix.name }}-stealth.zip
            ${{ matrix.name }}-cjk.zip
            ${{ matrix.name }}-cjk-stealth.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # This job never checks out or executes repository code. The write token is
      # available only while collecting and publishing the completed artifacts.
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
